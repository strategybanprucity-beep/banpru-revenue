name: Deploy to Cloudflare
on:
  workflow_dispatch:
    inputs:
      enable_r2:
        description: Enable uploads (requires an existing R2 bucket)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: revenue
      DATABASE_NAME: banpru-revenue-db
      R2_ENABLED: ${{ inputs.enable_r2 }}
      R2_BUCKET_NAME: banpru-revenue-files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate account provisioning
        run: node tests/provision-super-admin.mjs
      - run: npm run build
      - run: npm run cloudflare:prepare
      - name: Apply database migrations
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --config .sites-runtime/cloudflare/wrangler.json
      - name: Create initial accounts without resetting existing accounts
        run: npm run provision:super-admin
        env:
          SUPER_ADMIN_USERNAME: ${{ secrets.SUPER_ADMIN_USERNAME }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
          INITIAL_ADMIN_NAME: ${{ secrets.INITIAL_ADMIN_NAME }}
      - name: Publish Worker and website assets
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js deploy --config .sites-runtime/cloudflare/wrangler.json
